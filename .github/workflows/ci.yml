name: CI

on:
  pull_request:
  push:
    branches: [Matisse, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - name: Audit secrets
        run: npm run audit:secrets
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit all dependencies
        run: npm audit --audit-level=high
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Vitest
        run: npm test
      - name: Validate production environment contract
        run: npm run validate:env
        env:
          SUPABASE_URL: https://ci-only.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_ci_only_non_operational_service_key
          ADMIN_PASSWORD: ci-only-strong-admin-password
          ADMIN_SECRET: ci-only-admin-secret-32-characters-minimum-value
          ADMIN_SESSION_VERSION: "1"
          RATE_LIMIT_SECRET: ci-only-rate-limit-secret-32-characters-value
          MARKETING_UNSUBSCRIBE_SECRET: ci-only-marketing-secret-32-characters-value
          CRON_SECRET: ci-only-cron-secret-24-characters-value
          RESEND_API_KEY: re_ci_only_non_operational_key_value
          EMAIL_FROM: PHENO CI <noreply@example.test>
          NEXT_PUBLIC_SITE_URL: https://example.test
          TRUST_PROXY: "false"
          HOSTING_PLATFORM: none
      - name: Next.js production build
        run: npm run build
        env:
          SUPABASE_URL: https://ci-only.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_ci_only_non_operational_service_key
          ADMIN_PASSWORD: ci-only-strong-admin-password
          ADMIN_SECRET: ci-only-admin-secret-32-characters-minimum-value
          ADMIN_SESSION_VERSION: "1"
          RATE_LIMIT_SECRET: ci-only-rate-limit-secret-32-characters-value
          MARKETING_UNSUBSCRIBE_SECRET: ci-only-marketing-secret-32-characters-value
          CRON_SECRET: ci-only-cron-secret-24-characters-value
          RESEND_API_KEY: re_ci_only_non_operational_key_value
          EMAIL_FROM: PHENO CI <noreply@example.test>
          NEXT_PUBLIC_SITE_URL: https://example.test
          TRUST_PROXY: "false"
          HOSTING_PLATFORM: none
